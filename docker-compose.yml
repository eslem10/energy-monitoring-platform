services:
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - API_HOST=0.0.0.0
      
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - chatbot

  chatbot:
    build: ./chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - ./chatbot-backend/.env